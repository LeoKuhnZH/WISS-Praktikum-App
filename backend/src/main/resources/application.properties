spring.config.import=optional:file:.env
spring.application.name=backend

# Datenbank-Konfiguration
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Zurich
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT-Konfiguration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}


# Upload-Limits & JPA
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.jpa.hibernate.ddl-auto=update
$spring.ai.openai.api-key=${OPENAI_API_KEY:dummy-key-for-ollama}
# LangChain4j / OpenAI / Ollama
langchain4j.ollama.chat-model.model-name=gemma2:2b
langchain4j.ollama.chat-model.timeout=60s
langchain4j.ollamal.base-url=http://localhost:11434
langchain4j.open-ai.streaming-chat-model.temperature=0.7