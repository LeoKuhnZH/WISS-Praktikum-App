spring.config.import=optional:file:.env[.properties]
spring.application.name=backend
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Zurich
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
langchain4j.open-ai.chat-model.api-key=sk-proj-deinEchterApiKeyHier...
langchain4j.open-ai.streaming-chat-model.model-name=gpt-4o-mini
langchain4j.open-ai.streaming-chat-model.temperature=0.7

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

spring.jpa.hibernate.ddl-auto=update